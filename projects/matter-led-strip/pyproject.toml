[project]
name = "matter-led-strip"
version = "0.1.0"
description = "External WS2812B strip of up to 25 LEDs exposed as a Matter Extended Color Light over a native ESP-Matter backend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "micropython-boardfarm>=0.10.0",
]

[tool.uv]
package = false

[tool.uv.sources]
micropython-boardfarm = { workspace = true }
