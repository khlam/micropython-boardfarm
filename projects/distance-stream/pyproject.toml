[project]
name = "distance-stream"
version = "0.3.0"
description = "VL53L0X time-of-flight → JSON-over-USB-CDC → FastAPI/WebSocket → Plotly dashboard."
readme = "README.md"
requires-python = ">=3.12"


dependencies = [
    "micropython-boardfarm>=0.5.0",
]

[tool.uv]
package = false

[tool.uv.sources]
boot_status_led = { index = "internal" }
i2c_bus = { index = "internal" }
smoothing = { index = "internal" }
vl53l0x = { index = "internal" }
