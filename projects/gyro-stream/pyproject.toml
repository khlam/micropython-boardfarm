[project]
name = "gyro-stream"
version = "0.3.0"
description = "MPU6050 accel/gyro/temp → JSON-over-USB-CDC → FastAPI/WebSocket → Plotly + 3D orientation dashboard."
readme = "README.md"
requires-python = ">=3.12"


dependencies = [
    "micropython-boardfarm>=0.5.0",
]

[tool.uv]
package = false

[tool.uv.sources]
micropython-boardfarm = { workspace = true }
boot_status_led = { index = "internal" }
i2c_bus = { index = "internal" }
mpu6050 = { index = "internal" }
