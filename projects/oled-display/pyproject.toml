[project]
name = "oled-display"
version = "0.1.0"
description = "SSD1306 OLED bouncing 'hello world!' + once-per-second counter, auto-scaled to fit."
readme = "README.md"
requires-python = ">=3.12"


dependencies = [
    "micropython-boardfarm>=0.5.0",
]

[tool.uv]
package = false

[tool.uv.sources]
micropython-boardfarm = { workspace = true }
boot_status_led = { index = "internal" }
i2c_bus = { index = "internal" }
ssd1306 = { index = "internal" }
oled_canvas = { index = "internal" }
