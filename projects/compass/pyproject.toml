[project]
name = "compass"
version = "0.1.0"
description = "QMC5883P magnetometer → JSON-over-USB-CDC → FastAPI/WebSocket → Plotly compass dashboard."
readme = "README.md"
requires-python = ">=3.12"


dependencies = [
    "boot_status_led>=0.2.0",
    "i2c_bus>=0.2.0",
    "qmc5883p>=0.1.0",
    "smoothing>=0.1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
boot_status_led = { workspace = true }
i2c_bus = { workspace = true }
qmc5883p = { workspace = true }
smoothing = { workspace = true }
