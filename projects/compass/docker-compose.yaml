---
services:
  # Builds the internal-package wheels so the viz stage installs serial_over_web
  # from the file:// index. Compose builds it before viz (additional_contexts).
  wheels:
    build:
      context: ../..
      dockerfile: Dockerfile.host
      target: wheels
    command: ["true"]

  # Compiles one universal UF2 for RP2040 + RP2350 (each bootloader skips foreign-family blocks).
  pi-compile:
    build:
      context: ../..
      dockerfile: Dockerfile.firmware
      target: pi-compile
    volumes:
      - ../../firmware-packages:/firmware-packages:ro
      - ./firmware:/firmware:ro
      - ./outputs:/outputs

  # Compiles the ESP32-S3 firmware to outputs/app.esp32-s3.bin; no hardware needed.
  esp32-compile:
    build:
      context: ../..
      dockerfile: Dockerfile.firmware
      target: esp32-compile
    volumes:
      - ../../firmware-packages:/firmware-packages:ro
      - ./firmware:/firmware:ro
      - ./outputs:/outputs

  # Flashes the compiled .bin to /dev/ttyACM0; runs esp32-compile first, then
  # fails fast if the board isn't visible.
  esp32-flash:
    build:
      context: ../..
      dockerfile: Dockerfile.firmware
      target: esp32-flash
    depends_on:
      esp32-compile:
        condition: service_completed_successfully
    volumes:
      - ./outputs:/outputs:ro
      - /dev:/dev
    device_cgroup_rules:
      - c 166:* rmw  # USB-ACM (TTY) major
    # Resolve host.docker.internal on Linux too (automatic on Docker Desktop) —
    # used when SERIAL_PORT is the macOS socket:// bridge.
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      # Linux: native device passthrough. macOS: run tools/serial-bridge.sh and
      # export SERIAL_PORT=socket://host.docker.internal:5555.
      - SERIAL_PORT=${SERIAL_PORT:-/dev/ttyACM0}

  # FastAPI dashboard on :18501. VIZ_DIR points the stage at this project's viz/.
  viz:
    build:
      context: ../..
      dockerfile: Dockerfile.host
      target: viz
      additional_contexts:
        wheels: service:wheels
      args:
        VIZ_DIR: projects/compass/viz
    # /dev bind-mount (not `devices:`) so unplug/replug survives without restart.
    volumes:
      - /dev:/dev
    device_cgroup_rules:
      - c 166:* rmw  # USB-ACM (TTY) major
    ports:
      - 18501:18501
    # Lets the container resolve host.docker.internal on Linux too (automatic on
    # Docker Desktop) — used when SERIAL_PORT is the macOS socket:// bridge.
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      # Linux: native device passthrough. macOS: run tools/serial-bridge.sh and
      # export SERIAL_PORT=socket://host.docker.internal:5555.
      - SERIAL_PORT=${SERIAL_PORT:-/dev/ttyACM0}
