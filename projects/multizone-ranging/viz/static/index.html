<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VL53L5CX — Multizone Live</title>
  <style>
    :root {
      --bg: #0e1117;
      --panel: #131722;
      --border: #1f2937;
      --text: #e6e6e6;
      --muted: #a1a1aa;
      --dim: #71717a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    h1 { margin: 0 0 12px; font-size: 20px; font-weight: 500; }
    .status {
      display: flex; gap: 16px; align-items: center;
      margin-bottom: 16px; flex-wrap: wrap;
    }
    .pill { padding: 4px 10px; border-radius: 12px; font-size: 13px; font-weight: 500; }
    .pill.ok  { background: #14532d; color: #86efac; }
    .pill.err { background: #7f1d1d; color: #fca5a5; }
    .stat { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .stat b { color: var(--text); font-weight: 500; }
    .err-msg { font-size: 12px; color: #fca5a5; }
    .panel {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 6px; padding: 12px;
      margin-bottom: 12px;
    }
    .panel h2 {
      margin: 0 0 8px; font-size: 13px; font-weight: 500;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em;
    }
    .stats-row {
      display: flex; gap: 24px; flex-wrap: wrap;
      font-variant-numeric: tabular-nums;
      margin-bottom: 8px;
    }
    .stats-row .stat-item { display: flex; flex-direction: column; gap: 2px; }
    .stats-row .stat-label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.05em; }
    .stats-row .stat-value { font-size: 22px; font-weight: 300; color: var(--text); }
    .log {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px; line-height: 1.45;
      max-height: 200px; overflow-y: auto;
      background: #0b0e14; border: 1px solid var(--border); border-radius: 4px;
      padding: 8px 10px;
    }
    .log-row { display: flex; gap: 8px; white-space: pre-wrap; word-break: break-word; }
    .log-time { color: var(--dim); flex-shrink: 0; }
    .log-tag {
      flex-shrink: 0; font-weight: 500;
      padding: 0 6px; border-radius: 3px; align-self: flex-start;
    }
    .log-tag.info     { background: #1e3a5f; color: #93c5fd; }
    .log-tag.ok       { background: #14532d; color: #86efac; }
    .log-tag.warn     { background: #78350f; color: #fcd34d; }
    .log-tag.err      { background: #7f1d1d; color: #fca5a5; }
    .log-tag.evt      { background: #2a2a3a; color: #c4b5fd; }
    .log-msg { color: var(--text); }
    .modebar { background: var(--panel) !important; }
    .modebar-btn path { fill: #a1a1aa !important; }
    .modebar-btn:hover path { fill: var(--text) !important; }
  </style>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
</head>
<body>
  <h1>VL53L5CX — 8×8 Multizone</h1>
  <div class="status">
    <span id="conn" class="pill err">Disconnected</span>
    <span class="stat">Port: <b id="port">—</b></span>
    <span class="stat">Rate: <b id="rate">—</b></span>
    <span class="stat">Frames: <b id="count">0</b></span>
    <span id="err" class="err-msg"></span>
  </div>

  <div class="panel">
    <h2>3D Point Cloud (mm)</h2>
    <div class="stats-row">
      <div class="stat-item">
        <span class="stat-label">Valid Zones</span>
        <span class="stat-value" id="stat-valid">—</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Min</span>
        <span class="stat-value" id="stat-min">— mm</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Avg</span>
        <span class="stat-value" id="stat-avg">— mm</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Max</span>
        <span class="stat-value" id="stat-max">— mm</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Focus</span>
        <span class="stat-value" id="stat-focus">— mm</span>
      </div>
    </div>
    <div id="scatter3d" style="height: 550px;"></div>
  </div>

  <div class="panel">
    <h2>Log</h2>
    <div id="log" class="log"></div>
  </div>

  <script>
  (function () {
    const RECONNECT_MS = 250;
    const LOG_MAX = 200;
    const GRID_SIZE = 8;
    const MAX_RANGE_MM = 4000;   // sensor full range; ceiling for the autoscaled color range
    const Z_MAX_MM = 1000;       // fixed top of the distance (z) axis; farther zones clip out of view

    // Near-focus tuning. With nothing in front of it the sensor still reports
    // valid ~1700 mm background reflections; left alone they dominate the color
    // scale and bury a closer target. Each frame the valid zones are split into a
    // near (foreground) and far (background) cluster: the color range tracks the
    // foreground and the background is drawn as faint gray dots that keep spatial
    // context without driving color. The distance (z) axis stays at a fixed range.
    const MIN_GAP_MM = 250;       // smallest distance jump that separates the two clusters
    const SNAP_STEP = 100;        // round the color range to this step so the colorbar doesn't jitter
    const EMA_ALPHA = 0.3;        // smoothing factor applied to the foreground bounds
    const MIN_SPAN_MM = 150;      // floor on the color range so a tight cluster keeps contrast
    const BG_COLOR = "#52525b";   // dimmed background dots
    const BG_SIZE = 3;
    const BG_OPACITY = 0.25;

    const $ = (id) => document.getElementById(id);

    const DIAG_TAGS = {
      scan: "info",
      firmware_loading: "info",
      vl53l5cx_ok: "ok",
      no_device: "warn",
      init_err: "err",
      read_err: "err",
    };

    function timestamp() {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3, "0")}`;
    }

    function logLine(tag, klass, msg) {
      const el = $("log");
      const atBottom = el.scrollHeight - el.clientHeight - el.scrollTop < 24;
      const row = document.createElement("div");
      row.className = "log-row";
      row.innerHTML =
        `<span class="log-time">${timestamp()}</span>` +
        `<span class="log-tag ${klass}">${tag}</span>` +
        `<span class="log-msg"></span>`;
      row.lastChild.textContent = msg;
      el.appendChild(row);
      while (el.childElementCount > LOG_MAX) el.removeChild(el.firstChild);
      if (atBottom) el.scrollTop = el.scrollHeight;
    }

    function logDiag(obj) {
      const kind = obj.diag;
      const klass = DIAG_TAGS[kind] || "info";
      const { diag, ...rest } = obj;
      const body = Object.keys(rest).length ? JSON.stringify(rest) : "";
      logLine(kind, klass, body);
    }

    const PANEL_BG = "#131722";
    const config = { displayModeBar: true, displaylogo: false, responsive: true };

    const layout = {
      paper_bgcolor: PANEL_BG,
      margin: { l: 0, r: 0, t: 10, b: 0 },
      scene: {
        bgcolor: PANEL_BG,
        dragmode: "orbit",
        xaxis: { title: "Column", range: [-0.5, 7.5], dtick: 1, color: "#a1a1aa", gridcolor: "#1f2937" },
        yaxis: { title: "Row",    range: [-0.5, 7.5], dtick: 1, color: "#a1a1aa", gridcolor: "#1f2937" },
        zaxis: { title: "Distance (mm)", range: [0, Z_MAX_MM], color: "#a1a1aa", gridcolor: "#1f2937" },
      },
    };

    // Trace 0: near targets, colored and scaled to the foreground cluster.
    const foreground = {
      type: "scatter3d",
      mode: "markers",
      x: [], y: [], z: [],
      marker: {
        size: 6,
        color: [],
        colorscale: "RdYlBu",
        cmin: 0,
        cmax: MAX_RANGE_MM,
        showscale: true,
        colorbar: {
          title: { text: "mm", font: { color: "#a1a1aa" } },
          tickfont: { color: "#a1a1aa" },
          bgcolor: PANEL_BG,
          bordercolor: "#1f2937",
        },
      },
      hovertemplate: "row: %{y}<br>col: %{x}<br>dist: %{z:.0f} mm<extra></extra>",
    };

    // Trace 1: far background, dimmed so it stays as context without competing.
    const background = {
      type: "scatter3d",
      mode: "markers",
      x: [], y: [], z: [],
      marker: { size: BG_SIZE, color: BG_COLOR, opacity: BG_OPACITY, showscale: false },
      hovertemplate: "row: %{y}<br>col: %{x}<br>dist: %{z:.0f} mm (bg)<extra></extra>",
    };

    const gd = $("scatter3d");
    Plotly.newPlot(gd, [foreground, background], layout, config);

    // Track the user's 3D camera so live data updates don't reset it. A gl3d
    // scene re-syncs its camera from the layout on every data write, so without
    // re-asserting the user's angle each frame an orbit gets thrown away and
    // snaps back. plotly_relayout fires when a drag/zoom settles; relayouting
    // fires continuously during the gesture, so capturing both keeps the camera
    // current even mid-drag.
    let userCamera = null;
    const captureCamera = (e) => {
      if (e && e["scene.camera"]) userCamera = e["scene.camera"];
    };
    gd.on("plotly_relayout", captureCamera);
    gd.on("plotly_relayouting", captureCamera);

    let totalCount = 0;
    let rateCount = 0;
    let rateAt = performance.now();
    let pendingData = null;
    let frameScheduled = false;
    // EMA-smoothed foreground bounds, held across frames so the color scale eases
    // toward new readings instead of snapping. null until the first frame.
    let smMin = null;
    let smMax = null;

    function flushPending() {
      if (!pendingData) return;
      const { fgX, fgY, fgZ, bgX, bgY, bgZ, cmin, cmax } = pendingData;
      // Push both traces, the data-driven color range, and a re-assertion of the
      // user's camera in one call, so the live refresh updates and recolors
      // without disturbing the current view. The distance (z) axis keeps its
      // static range. cmin/cmax on the gray background trace are inert (it has no
      // colorscale), so we set both here.
      Plotly.update(
        gd,
        {
          x: [fgX, bgX],
          y: [fgY, bgY],
          z: [fgZ, bgZ],
          "marker.color": [fgZ, BG_COLOR],
          "marker.cmin": [cmin, cmin],
          "marker.cmax": [cmax, cmax],
        },
        userCamera ? { "scene.camera": userCamera } : {},
        [0, 1],
      );
      pendingData = null;
    }

    function scheduleFrame() {
      if (frameScheduled) return;
      frameScheduled = true;
      requestAnimationFrame(() => {
        frameScheduled = false;
        flushPending();
      });
    }

    function setStatus(connected, port, error) {
      const pill = $("conn");
      pill.textContent = connected ? "Connected" : "Disconnected";
      pill.className = "pill " + (connected ? "ok" : "err");
      if (port) $("port").textContent = port;
      $("err").textContent = error || "";
    }

    function updateStats(grid) {
      const valid = grid.filter((v) => v !== null);
      $("stat-valid").textContent = valid.length + " / 64";
      if (valid.length === 0) {
        $("stat-min").textContent = "— mm";
        $("stat-avg").textContent = "— mm";
        $("stat-max").textContent = "— mm";
        return;
      }
      const mn = Math.min(...valid);
      const mx = Math.max(...valid);
      const avg = Math.round(valid.reduce((a, b) => a + b, 0) / valid.length);
      $("stat-min").textContent = mn + " mm";
      $("stat-avg").textContent = avg + " mm";
      $("stat-max").textContent = mx + " mm";
    }

    function splitZones(zones) {
      // Separate near targets from a far background plane at the largest gap in
      // sorted distance: a wall sits well behind a hand or object, so the biggest
      // jump divides the two. When no jump reaches MIN_GAP_MM the scene is a single
      // cluster (a lone near object, or pure background with nothing in front) and
      // everything is treated as foreground.
      if (zones.length < 2) return { fg: zones, bg: [] };
      const sorted = zones.slice().sort((a, b) => a.v - b.v);
      let gap = 0, at = -1;
      for (let i = 1; i < sorted.length; i++) {
        const d = sorted[i].v - sorted[i - 1].v;
        if (d > gap) { gap = d; at = i; }
      }
      if (gap < MIN_GAP_MM) return { fg: zones, bg: [] };
      const cutoff = (sorted[at].v + sorted[at - 1].v) / 2;
      const fg = [], bg = [];
      for (const z of zones) (z.v <= cutoff ? fg : bg).push(z);
      return { fg, bg };
    }

    function focusBounds(fg) {
      // Smooth the foreground min/max (EMA) and snap to SNAP_STEP so the colorbar
      // stays legible at 10 Hz instead of jittering each frame. An empty
      // foreground (no valid zones) holds the last bounds so a momentary dropout
      // doesn't reset the color scale.
      if (fg.length === 0) return { cmin: smMin ?? 0, cmax: smMax ?? MAX_RANGE_MM };
      let lo = Infinity, hi = -Infinity;
      for (const z of fg) {
        if (z.v < lo) lo = z.v;
        if (z.v > hi) hi = z.v;
      }
      smMin = smMin === null ? lo : smMin + EMA_ALPHA * (lo - smMin);
      smMax = smMax === null ? hi : smMax + EMA_ALPHA * (hi - smMax);
      let cmin = Math.max(0, Math.floor(smMin / SNAP_STEP) * SNAP_STEP);
      let cmax = Math.min(MAX_RANGE_MM, Math.ceil(smMax / SNAP_STEP) * SNAP_STEP);
      if (cmax - cmin < MIN_SPAN_MM) cmax = Math.min(MAX_RANGE_MM, cmin + MIN_SPAN_MM);
      return { cmin, cmax };
    }

    function onMessage(obj) {
      if (obj.event === "connected") {
        setStatus(true, obj.port, null);
        logLine("connected", "evt", obj.port || "");
        return;
      }
      if (obj.event === "disconnected") {
        setStatus(false, obj.port, obj.error);
        logLine("disconnected", "evt", obj.error || "");
        return;
      }
      if (obj.diag !== undefined) {
        logDiag(obj);
        return;
      }
      if (!("grid" in obj)) return;

      const flat = obj.grid;
      if (!Array.isArray(flat) || flat.length !== 64) return;

      const zones = [];
      for (let i = 0; i < 64; i++) {
        const v = flat[i];
        if (v !== null) zones.push({ x: i % GRID_SIZE, y: Math.floor(i / GRID_SIZE), v });
      }

      const { fg, bg } = splitZones(zones);
      const { cmin, cmax } = focusBounds(fg);
      pendingData = {
        fgX: fg.map((z) => z.x), fgY: fg.map((z) => z.y), fgZ: fg.map((z) => z.v),
        bgX: bg.map((z) => z.x), bgY: bg.map((z) => z.y), bgZ: bg.map((z) => z.v),
        cmin, cmax,
      };
      updateStats(flat);
      $("stat-focus").textContent = fg.length ? "≤ " + cmax + " mm" : "— mm";

      totalCount++;
      rateCount++;
      $("count").textContent = totalCount;

      const now = performance.now();
      const dt = now - rateAt;
      if (dt >= 1000) {
        $("rate").textContent = (rateCount * 1000 / dt).toFixed(1) + " Hz";
        rateCount = 0;
        rateAt = now;
      }

      scheduleFrame();
    }

    function connect() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      const ws = new WebSocket(proto + "//" + location.host + "/ws");
      ws.onmessage = (ev) => {
        try { onMessage(JSON.parse(ev.data)); } catch { /* ignore non-JSON */ }
      };
      ws.onclose = () => {
        setStatus(false, $("port").textContent, "WebSocket closed — reconnecting…");
        setTimeout(connect, RECONNECT_MS);
      };
      ws.onerror = () => { /* onclose will fire and reconnect */ };
    }

    connect();
  })();
  </script>
</body>
</html>
