---
services:
  # Builds internal wheels so the viz stage installs serial_over_web from the
  # repository's file:// index.
  wheels:
    build:
      context: ../..
      dockerfile: Dockerfile.host
      target: wheels
    command: ["true"]

  # Produces separate RP2040 and RP2350 UF2s. This demo deliberately runs only
  # on RP2040; the RP2350 image reports unsupported_mcu at runtime.
  pi-compile:
    build:
      context: ../..
      dockerfile: Dockerfile.firmware
      target: pi-compile
    volumes:
      - ../../firmware-packages:/firmware-packages:ro
      - ./firmware:/firmware:ro
      - ./outputs:/outputs
    environment:
      - RP_UF2_MODE=separate

  # FastAPI/WebSocket dashboard on :18501, fed by MCU JSON over USB-CDC.
  viz:
    build:
      context: ../..
      dockerfile: Dockerfile.host
      target: viz
      additional_contexts:
        wheels: service:wheels
      args:
        VIZ_DIR: projects/ld2450/viz
    volumes:
      - /dev:/dev
    device_cgroup_rules:
      - c 166:* rmw
    ports:
      - 18501:18501
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - SERIAL_PORT=${SERIAL_PORT:-/dev/ttyACM0}
