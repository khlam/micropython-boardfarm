<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATGM336H GPS — Live</title>
  <style>
    :root {
      --bg: #0e1117;
      --panel: #131722;
      --border: #1f2937;
      --text: #e6e6e6;
      --muted: #a1a1aa;
      --dim: #71717a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    h1 { margin: 0 0 12px; font-size: 20px; font-weight: 500; }
    .status {
      display: flex; gap: 16px; align-items: center;
      margin-bottom: 16px; flex-wrap: wrap;
    }
    .pill { padding: 4px 10px; border-radius: 12px; font-size: 13px; font-weight: 500; }
    .pill.ok  { background: #14532d; color: #86efac; }
    .pill.err { background: #7f1d1d; color: #fca5a5; }
    .stat { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .stat b { color: var(--text); font-weight: 500; }
    .err-msg { font-size: 12px; color: #fca5a5; }
    .row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
      margin-bottom: 16px; align-items: stretch;
    }
    @media (max-width: 800px) { .row { grid-template-columns: 1fr; } }
    .panel {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 6px; padding: 12px;
    }
    .panel h2 {
      margin: 0 0 8px; font-size: 13px; font-weight: 500;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em;
    }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    @media (max-width: 800px) { .metrics { grid-template-columns: 1fr 1fr; } }
    .metric {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 10px;
    }
    .metric-label { font-size: 12px; color: var(--muted); }
    .metric-value {
      font-size: 20px; font-weight: 500; margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }
    .metric-value.small { font-size: 15px; }
    .fix-bar {
      display: flex; gap: 16px; align-items: center;
      flex-wrap: wrap; margin-bottom: 16px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 6px; padding: 8px 12px;
    }
    .pill.fix    { background: #14532d; color: #86efac; }
    .pill.no-fix { background: #3f3f46; color: #a1a1aa; }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin=""/>
  <style>
    .maplibregl-map { background: #0e1117; }
    .maplibregl-ctrl-attrib {
      background: rgba(14,17,23,0.8) !important;
      color: #71717a !important;
    }
    .maplibregl-ctrl-attrib a { color: #a1a1aa !important; }
    .maplibregl-ctrl-group {
      background: #131722 !important;
      border-color: #1f2937 !important;
    }
    .maplibregl-ctrl-group button {
      background: #131722 !important;
      color: #e6e6e6 !important;
    }
    .maplibregl-ctrl-group button:hover { background: #1f2937 !important; }
  </style>
</head>
<body>
  <h1>ATGM336H GPS — Live</h1>
  <div class="status">
    <span id="conn" class="pill err">Disconnected</span>
    <span class="stat">Port: <b id="port">—</b></span>
    <span class="stat">Windows: <b id="win-count">0</b></span>
    <span class="stat">Last window: <b id="last-count">—</b> sentences</span>
    <span id="err" class="err-msg"></span>
  </div>

  <div class="fix-bar">
    <span id="fix-pill" class="pill no-fix">NO FIX</span>
    <span class="stat">Lat: <b id="bar-lat">—</b></span>
    <span class="stat">Lon: <b id="bar-lon">—</b></span>
    <span class="stat">Alt: <b id="bar-alt">—</b></span>
    <span class="stat">Sats: <b id="bar-sats">0 used / 0 in view</b></span>
    <span class="stat">HDOP: <b id="bar-hdop">—</b></span>
  </div>

  <div class="row">
    <div class="panel">
      <h2>Satellites Tracked</h2>
      <div id="plot-sats" style="height: 300px;"></div>
    </div>
    <div class="panel">
      <h2>DOP Values</h2>
      <div id="plot-dop" style="height: 300px;"></div>
    </div>
  </div>

  <div class="panel" style="margin-bottom: 16px;">
    <h2>Position</h2>
    <div id="map" style="height: 420px; border-radius: 4px; overflow: hidden;"></div>
  </div>

  <div class="panel" style="margin-bottom: 16px;">
    <h2>Signal Strength</h2>
    <div id="plot-signal" style="height: 260px;"></div>
  </div>

  <div class="panel" style="margin-bottom: 16px;">
    <h2>Current Fix</h2>
    <div class="metrics">
      <div class="metric">
        <div class="metric-label">Latitude</div>
        <div class="metric-value small" id="stat-lat">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">Longitude</div>
        <div class="metric-value small" id="stat-lon">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">Satellites (use / view)</div>
        <div class="metric-value" id="stat-sats">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">HDOP / VDOP / PDOP</div>
        <div class="metric-value small" id="stat-dop">—</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin=""></script>
  <script>
  (function () {
    const MAX_WINDOWS = 120;
    const RECONNECT_MS = 250;

    const $ = (id) => document.getElementById(id);

    const PANEL_BG = "#131722";
    const AXIS_COLOR = "#a1a1aa";
    const GRID_COLOR = "#1f2937";
    const config = { displayModeBar: false, responsive: true };

    const lineLayoutBase = {
      paper_bgcolor: PANEL_BG,
      plot_bgcolor: PANEL_BG,
      font: { color: AXIS_COLOR, size: 11 },
      margin: { l: 46, r: 10, t: 6, b: 40 },
      xaxis: {
        title: "Window #", gridcolor: GRID_COLOR,
        zerolinecolor: GRID_COLOR, color: AXIS_COLOR,
      },
      legend: { orientation: "h", y: -0.18, font: { size: 11 } },
    };

    // --- Satellites Tracked ---
    Plotly.newPlot("plot-sats", [
      {
        name: "In Use", type: "scatter", mode: "lines",
        x: [], y: [],
        line: { color: "#22c55e", width: 2 },
        hovertemplate: "Window %{x}<br>In Use: %{y}<extra></extra>",
      },
      {
        name: "In View", type: "scatter", mode: "lines",
        x: [], y: [],
        line: { color: "#3b82f6", width: 2 },
        hovertemplate: "Window %{x}<br>In View: %{y}<extra></extra>",
      },
    ], {
      ...lineLayoutBase,
      yaxis: {
        title: "Count", gridcolor: GRID_COLOR,
        zerolinecolor: GRID_COLOR, color: AXIS_COLOR, rangemode: "tozero",
      },
    }, config);

    // --- DOP Values ---
    Plotly.newPlot("plot-dop", [
      {
        name: "HDOP", type: "scatter", mode: "lines",
        x: [], y: [],
        line: { color: "#eab308", width: 2 },
        hovertemplate: "Window %{x}<br>HDOP: %{y}<extra></extra>",
      },
      {
        name: "VDOP", type: "scatter", mode: "lines",
        x: [], y: [],
        line: { color: "#f97316", width: 2 },
        hovertemplate: "Window %{x}<br>VDOP: %{y}<extra></extra>",
      },
      {
        name: "PDOP", type: "scatter", mode: "lines",
        x: [], y: [],
        line: { color: "#ef4444", width: 2 },
        hovertemplate: "Window %{x}<br>PDOP: %{y}<extra></extra>",
      },
    ], {
      ...lineLayoutBase,
      yaxis: {
        title: "DOP", gridcolor: GRID_COLOR,
        zerolinecolor: GRID_COLOR, color: AXIS_COLOR, rangemode: "tozero",
      },
      annotations: [{
        text: "lower = better accuracy",
        xref: "paper", yref: "paper",
        x: 0.99, y: 0.99,
        xanchor: "right", yanchor: "top",
        showarrow: false,
        font: { size: 11, color: "#71717a" },
      }],
    }, config);

    // --- Signal Strength (rebuilt each window) ---
    const signalLayout = {
      paper_bgcolor: PANEL_BG,
      plot_bgcolor: PANEL_BG,
      font: { color: AXIS_COLOR, size: 11 },
      margin: { l: 64, r: 30, t: 6, b: 40 },
      barmode: "overlay",
      xaxis: {
        title: "SNR (dB-Hz)", gridcolor: GRID_COLOR,
        zerolinecolor: GRID_COLOR, color: AXIS_COLOR, rangemode: "tozero",
      },
      yaxis: { color: AXIS_COLOR, automargin: true },
      legend: { orientation: "h", y: -0.18, font: { size: 11 } },
    };

    Plotly.newPlot("plot-signal", [
      { name: "GPS",    type: "bar", orientation: "h", x: [], y: [], marker: { color: "#3b82f6" } },
      { name: "BeiDou", type: "bar", orientation: "h", x: [], y: [], marker: { color: "#f97316" } },
    ], signalLayout, config);

    let winNum = 0;

    // --- Map (MapLibre GL JS + OpenFreeMap dark style — no API key required) ---
    let _map = null;
    let _posMarker = null;

    function updateMap(lat, lon) {
      if (lat == null || lon == null) return;
      if (typeof maplibregl === "undefined") return;
      const lnglat = [lon, lat];
      if (_map === null) {
        _map = new maplibregl.Map({
          container: "map",
          style: "https://tiles.openfreemap.org/styles/dark",
          center: lnglat,
          zoom: 15,
        });
        _map.addControl(new maplibregl.NavigationControl(), "top-right");
        const el = document.createElement("div");
        el.style.cssText = "width:18px;height:18px;border-radius:50%;background:#22c55e;border:2px solid #166534;box-shadow:0 0 6px #22c55e88;";
        _posMarker = new maplibregl.Marker({ element: el }).setLngLat(lnglat).addTo(_map);
      } else {
        _posMarker.setLngLat(lnglat);
        _map.panTo(lnglat);
      }
    }

    function setStatus(connected, port, error) {
      const pill = $("conn");
      pill.textContent = connected ? "Connected" : "Disconnected";
      pill.className = "pill " + (connected ? "ok" : "err");
      if (port) $("port").textContent = port;
      $("err").textContent = error || "";
    }

    function extendLine(divId, winN, values) {
      // values is an array aligned with traces; null entries are skipped per trace.
      const x = values.map(() => [winN]);
      const y = values.map((v) => [v === null || v === undefined ? null : v]);
      Plotly.extendTraces(divId, { x, y }, values.map((_, i) => i), MAX_WINDOWS);
    }

    function rebuildSignal(signals) {
      if (!signals || signals.length === 0) {
        Plotly.react("plot-signal", [
          { name: "GPS",    type: "bar", orientation: "h", x: [], y: [], marker: { color: "#3b82f6" } },
          { name: "BeiDou", type: "bar", orientation: "h", x: [], y: [], marker: { color: "#f97316" } },
        ], signalLayout, config);
        return;
      }

      // Sort ascending by SNR so weakest is at the bottom, strongest at the top.
      const sorted = [...signals].sort((a, b) => a.snr - b.snr);
      const allLabels = sorted.map((s) => s.sys + "-" + s.prn);

      const gp = sorted.filter((s) => s.sys === "GP");
      const bd = sorted.filter((s) => s.sys === "BD");

      Plotly.react("plot-signal", [
        {
          name: "GPS", type: "bar", orientation: "h",
          x: gp.map((s) => s.snr),
          y: gp.map((s) => "GP-" + s.prn),
          marker: { color: "#3b82f6" },
          hovertemplate: "%{y}: %{x} dB-Hz<extra></extra>",
        },
        {
          name: "BeiDou", type: "bar", orientation: "h",
          x: bd.map((s) => s.snr),
          y: bd.map((s) => "BD-" + s.prn),
          marker: { color: "#f97316" },
          hovertemplate: "%{y}: %{x} dB-Hz<extra></extra>",
        },
      ], {
        ...signalLayout,
        yaxis: {
          ...signalLayout.yaxis,
          categoryorder: "array",
          categoryarray: allLabels,
        },
        height: Math.max(200, sorted.length * 26 + 80),
      }, config);
    }

    function updateStats(obj) {
      const fmt = (v, dec) => (v === null || v === undefined) ? "—" : v.toFixed(dec);
      const hasFix = obj.lat !== null && obj.lat !== undefined;

      const pill = $("fix-pill");
      pill.textContent = hasFix ? "FIX" : "NO FIX";
      pill.className = "pill " + (hasFix ? "fix" : "no-fix");

      $("bar-lat").textContent  = fmt(obj.lat, 6);
      $("bar-lon").textContent  = fmt(obj.lon, 6);
      $("bar-alt").textContent  = obj.alt !== null && obj.alt !== undefined ? fmt(obj.alt, 1) + " m" : "—";
      const u = obj.sats_in_use  !== undefined ? obj.sats_in_use  : 0;
      const vv = obj.sats_in_view !== undefined ? obj.sats_in_view : 0;
      $("bar-sats").textContent = u + " used / " + vv + " in view";
      $("bar-hdop").textContent = fmt(obj.hdop, 1);

      $("stat-lat").textContent = fmt(obj.lat, 6);
      $("stat-lon").textContent = fmt(obj.lon, 6);
      $("stat-sats").textContent = u + " / " + vv;
      const h = fmt(obj.hdop, 1), vd = fmt(obj.vdop, 1), p = fmt(obj.pdop, 1);
      $("stat-dop").textContent = h + " / " + vd + " / " + p;
    }

    function clearStats() {
      const pill = $("fix-pill");
      pill.textContent = "NO FIX";
      pill.className = "pill no-fix";
      ["bar-lat", "bar-lon", "bar-alt", "bar-hdop"].forEach((id) => { $(id).textContent = "—"; });
      $("bar-sats").textContent = "0 used / 0 in view";
      ["stat-lat", "stat-lon", "stat-sats", "stat-dop"].forEach((id) => { $(id).textContent = "—"; });
    }

    function onDataWindow(obj) {
      winNum++;
      $("win-count").textContent = winNum;
      $("last-count").textContent = obj.count;

      extendLine("plot-sats", winNum, [obj.sats_in_use, obj.sats_in_view]);
      extendLine("plot-dop",  winNum, [obj.hdop, obj.vdop, obj.pdop]);
      rebuildSignal(obj.signals);
      updateStats(obj);
      updateMap(obj.lat, obj.lon);
    }

    function onNoData() {
      winNum++;
      $("win-count").textContent = winNum;
      $("last-count").textContent = "0";

      extendLine("plot-sats", winNum, [null, null]);
      extendLine("plot-dop",  winNum, [null, null, null]);
      rebuildSignal([]);
      clearStats();
    }

    function onMessage(obj) {
      if (obj.event === "connected") {
        setStatus(true, obj.port, null);
        return;
      }
      if (obj.event === "disconnected") {
        setStatus(false, obj.port, obj.error);
        return;
      }
      if (obj.diag === "no_data") {
        onNoData();
        return;
      }
      if (obj.diag !== undefined) return;
      if (obj.sentences === undefined) return;
      onDataWindow(obj);
    }

    function connect() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      const ws = new WebSocket(proto + "//" + location.host + "/ws");
      ws.onmessage = (ev) => {
        try { onMessage(JSON.parse(ev.data)); } catch { /* ignore non-JSON */ }
      };
      ws.onclose = () => {
        setStatus(false, $("port").textContent, "WebSocket closed — reconnecting…");
        setTimeout(connect, RECONNECT_MS);
      };
      ws.onerror = () => { /* onclose fires and reconnects */ };
    }

    connect();
  })();
  </script>
</body>
</html>
