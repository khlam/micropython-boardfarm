---
services:
  esp32-compile:
    build:
      context: ../..
      dockerfile: Dockerfile.matter
      target: matter-toolchain
    environment:
      - MATTER_BOARD=ESP32_S3_MATTER
      - PASSCODE=${PASSCODE:-}
      - MANUFACTURER=${MANUFACTURER:-}
      - SERIAL_NUMBER=${SERIAL_NUMBER:-}
    volumes:
      # manifest.py hardcodes /firmware-packages and /firmware.
      - ../../firmware-packages:/firmware-packages:ro
      - ../../tools/matter-build:/matter-tools:ro
      - ./firmware:/firmware:ro
      - ./native/board:/matter-board:ro
      - ./pyproject.toml:/project/pyproject.toml:ro
      # build.py freezes this page so the board serves the dashboard itself.
      - ./viz:/viz:ro
      - ./outputs:/outputs
      - matter-build-cache:/build-cache

  # The same build for the AI-Thinker ESP32-CAM. build.py keeps one IDF build
  # tree per board in the shared cache, and publishes app.esp32-cam.* beside
  # any app.esp32-s3.* already in outputs/.
  esp32cam-compile:
    build:
      context: ../..
      dockerfile: Dockerfile.matter
      target: matter-toolchain
    environment:
      - MATTER_BOARD=ESP32_CAM_MATTER
      - PASSCODE=${PASSCODE:-}
      - MANUFACTURER=${MANUFACTURER:-}
      - SERIAL_NUMBER=${SERIAL_NUMBER:-}
    volumes:
      # manifest.py hardcodes /firmware-packages and /firmware.
      - ../../firmware-packages:/firmware-packages:ro
      - ../../tools/matter-build:/matter-tools:ro
      - ./firmware:/firmware:ro
      - ./native/board:/matter-board:ro
      - ./pyproject.toml:/project/pyproject.toml:ro
      # build.py freezes this page so the board serves the dashboard itself.
      - ./viz:/viz:ro
      - ./outputs:/outputs
      - matter-build-cache:/build-cache

  # For the ESP32-CAM, set SERIAL_PORT=/dev/ttyUSB0.
  esp32-monitor:
    build:
      context: ../..
      dockerfile: Dockerfile.matter
      target: matter-monitor
    environment:
      - SERIAL_PORT=${SERIAL_PORT:-/dev/ttyACM0}
      - MONITOR_SECONDS=${MONITOR_SECONDS:-90}
      - MONITOR_BAUD=${MONITOR_BAUD:-115200}
      - MONITOR_RESET=${MONITOR_RESET:-1}
      - MONITOR_PROBE=${MONITOR_PROBE:-0}
      - MONITOR_SEND=${MONITOR_SEND:-}
      - MONITOR_INTERRUPT=${MONITOR_INTERRUPT:-0}
    volumes:
      - ../../tools/matter-build:/matter-tools:ro
      - /dev:/dev
    device_cgroup_rules:
      - c 166:* rmw  # USB-ACM (ESP32-S3 native USB)
      - c 188:* rmw  # USB-serial (ESP32-CAM-MB)

  esp32-flash:
    build:
      context: ../..
      dockerfile: Dockerfile.matter
      target: matter-flash
    depends_on:
      esp32-compile:
        condition: service_completed_successfully
    environment:
      - SERIAL_PORT=${SERIAL_PORT:-/dev/ttyACM0}
    volumes:
      - ./outputs:/outputs:ro
      - /dev:/dev
    device_cgroup_rules:
      - c 166:* rmw
    extra_hosts:
      - host.docker.internal:host-gateway

  esp32cam-flash:
    build:
      context: ../..
      dockerfile: Dockerfile.matter
      target: matter-cam-flash
    depends_on:
      esp32cam-compile:
        condition: service_completed_successfully
    environment:
      - SERIAL_PORT=${SERIAL_PORT:-/dev/ttyUSB0}
    volumes:
      - ./outputs:/outputs:ro
      - /dev:/dev
    device_cgroup_rules:
      - c 188:* rmw  # USB-serial (ESP32-CAM-MB)
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  matter-build-cache:
