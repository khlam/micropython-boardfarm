[project]
name = "clock"
version = "0.1.0"
description = "ATGM336H GPS → longitude-derived local time → 8x32 MAX7219 LED matrix clock (time + day-of-week)."
readme = "README.md"
requires-python = ">=3.12"


dependencies = [
    "boot_status_led>=0.1.0",
    "atgm336h>=0.1.0",
    "nmea>=0.1.0",
    "tz_offset>=0.1.0",
    "max7219>=0.1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
boot_status_led = { index = "internal" }
atgm336h = { index = "internal" }
nmea = { index = "internal" }
tz_offset = { index = "internal" }
max7219 = { index = "internal" }
