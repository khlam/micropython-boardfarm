---
# Docker-only CI for lint, tests, firmware compiles, and dependency scan.
name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  version-check:
    name: Repo guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0
      - name: Enforce version bumps vs main
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          ./.githooks/check_version_bumps.sh --base origin/main
      - name: Enforce vendored files unchanged
        # Vendored drivers must not be hand-edited. Escape hatch for legitimate
        # re-vendoring: also touch the package VENDOR.md in the same change.
        run: |
          set -euo pipefail
          vendored=(
            "firmware-packages/vl53l0x/vl53l0x/vl53l0x.py"
            "firmware-packages/vl53l5cx/vl53l5cx/vl53l5cx.py"
            "firmware-packages/vl53l5cx/vl53l5cx/_config_bytes.py"
          )
          changed="$(git diff --name-only origin/main...HEAD)"
          fail=0
          for f in "${vendored[@]}"; do
            if grep -qxF "$f" <<<"$changed"; then
              vdir="$(dirname "$(dirname "$f")")"   # firmware-packages/<pkg>
              if ! grep -qxF "$vdir/VENDOR.md" <<<"$changed"; then
                echo "::error::vendored file edited without updating $vdir/VENDOR.md: $f (see VENDOR.md)"
                fail=1
              fi
            fi
          done
          [[ $fail -eq 0 ]]
  lint:
    name: Lint
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Run linters (shared with pre-commit)
        run: |
          set -euo pipefail
          mapfile -t files < <(
            git ls-files '*.py' '*.yml' '*.yaml'
            git ls-files \
              | grep -E '(^|/)(Dockerfile(\.[^/]+)?|.*\.[dD]ockerfile)$' || true
          )
          ./.githooks/run-linters.sh "${files[@]}"
  test:
    name: Tests (native + pytest with 90% coverage gate)
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Run native Matter queue tests
        run: docker compose up matter-native-test --build --exit-code-from matter-native-test
      - name: Run pytest
        run: docker compose up pytest --build --exit-code-from pytest
  compile-firmware:
    name: Compile ${{ matrix.label }} (${{ matrix.project }})
    needs: version-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - compass
          - distance-stream
          - gps
          - gyro-stream
          - led-effects
          - multizone-ranging
        target:
          - rp
          - esp32
        include:
          # max_bytes: per-artifact size budgets (cloud-only). See CI.md
          # "Firmware size budgets" for the rationale and how to bump them.
          - target: rp
            service: pi-compile
            label: RP2040 + RP2350
            pattern: outputs/*.uf2
            max_bytes: 3145728  # 3 MiB per .uf2
          - target: esp32
            service: esp32-compile
            label: ESP32-S3
            pattern: outputs/*.bin
            max_bytes: 2097152  # 2 MiB per .bin
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Compile ${{ matrix.label }}
        working-directory: projects/${{ matrix.project }}
        run: docker compose up --build --exit-code-from ${{ matrix.service }} ${{ matrix.service }}
      - name: Check firmware artifact sizes
        working-directory: projects/${{ matrix.project }}
        env:
          PATTERN: ${{ matrix.pattern }}
          MAX_BYTES: ${{ matrix.max_bytes }}
        # Every produced artifact must be non-empty and within budget. A
        # project emits one universal .uf2 today, but may split into per-chip
        # .uf2 files later; the glob checks each on its own, so both layouts
        # pass as long as no single file blows the budget.
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=($PATTERN)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::no firmware artifact matched $PATTERN"
            exit 1
          fi
          fail=0
          for f in "${files[@]}"; do
            size=$(stat -c%s "$f")
            if [[ "$size" -eq 0 ]]; then
              echo "::error::$f is empty"
              fail=1
            elif [[ "$size" -gt "$MAX_BYTES" ]]; then
              echo "::error::$f is ${size} B, over the ${MAX_BYTES} B budget"
              fail=1
            fi
            echo "- \`$f\` — ${size} B / ${MAX_BYTES} B budget" >> "$GITHUB_STEP_SUMMARY"
          done
          [[ $fail -eq 0 ]]
  matter-firmware:
    name: Matter ESP32-S3
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Compile and validate merged Matter image
        working-directory: projects/matter
        run: docker compose up --build --exit-code-from esp32-compile esp32-compile
  vuln-check:
    name: Dependency vulnerability scan
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Build uv-secure image
        run: docker buildx bake -f docker-bake.hcl scan-uv-secure
      - name: Scan uv.lock (fail only on actionable fixes)
        run: docker run --rm -v "$PWD":/work -w /work local/uv-secure
  cve-scan:
    name: Image CVE scan (Trivy ${{ matrix.bake }})
    needs: version-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - bake: scan-viz
            image: local/scan:viz
          - bake: scan-pytest
            image: local/scan:pytest
          - bake: scan-uv-secure
            image: local/scan:uv-secure
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Build ${{ matrix.bake }} image
        run: docker buildx bake -f docker-bake.hcl ${{ matrix.bake }}
      - name: Trivy image scan (report-only)
        # renovate: datasource=docker depName=aquasec/trivy
        run: |-
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.71.0 image \
            --severity HIGH,CRITICAL --exit-code 0 --format table \
            "${{ matrix.image }}"
  all-checks-pass:
    name: All checks pass
    runs-on: ubuntu-latest
    needs: [version-check, lint, test, compile-firmware, matter-firmware, vuln-check, cve-scan]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          set -euo pipefail
          declare -A results=(
            [version-check]="${{ needs.version-check.result }}"
            [lint]="${{ needs.lint.result }}"
            [test]="${{ needs.test.result }}"
            [compile-firmware]="${{ needs.compile-firmware.result }}"
            [matter-firmware]="${{ needs.matter-firmware.result }}"
            [vuln-check]="${{ needs.vuln-check.result }}"
            [cve-scan]="${{ needs.cve-scan.result }}"
          )
          failed=0
          for job in "${!results[@]}"; do
            if [[ "${results[$job]}" != "success" ]]; then
              echo "::error::$job → ${results[$job]}"
              failed=1
            fi
          done
          [[ $failed -eq 0 ]] && echo "All checks passed." || exit 1
