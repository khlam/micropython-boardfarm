---
# Docker-only CI for lint, tests, firmware compiles, and dependency scan.
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    name: Version bump gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce version bumps vs main
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          ./.githooks/check_version_bumps.sh --base origin/main

  lint:
    name: Lint
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run linters (shared with pre-commit)
        run: |
          set -euo pipefail
          mapfile -t files < <(
            git ls-files '*.py' '*.yml' '*.yaml'
            git ls-files \
              | grep -E '(^|/)(Dockerfile(\.[^/]+)?|.*\.[dD]ockerfile)$' || true
          )
          ./.githooks/run-linters.sh "${files[@]}"

  test:
    name: Pytest (full suite + 90% coverage gate)
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run pytest
        run: docker compose up pytest --build --exit-code-from pytest

  build-firmware:
    name: Build RP firmware (${{ matrix.project }})
    needs: version-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - distance-stream
          - gyro-stream
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile RP2040 + RP2350 universal UF2
        working-directory: projects/${{ matrix.project }}
        run: docker compose up --build --exit-code-from compile compile

      - name: Verify UF2 was produced
        working-directory: projects/${{ matrix.project }}
        run: test -s outputs/app.rp2040.rp2350.uf2

  vuln-check:
    name: Dependency vulnerability scan
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build uv-secure image
        run: docker build --target uv-secure -t local/uv-secure -f Dockerfile.linters .

      - name: Scan uv.lock (fail only on actionable fixes)
        run: docker run --rm -v "$PWD":/work -w /work local/uv-secure

  cve-scan:
    name: Image CVE scan (Trivy ${{ matrix.target }})
    needs: version-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile.host
            target: viz
          - dockerfile: Dockerfile.tests
            target: pytest
          - dockerfile: Dockerfile.linters
            target: uv-secure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.target }} image
        run: |
          docker build --target ${{ matrix.target }} -t "local/scan:${{ matrix.target }}" \
            -f ${{ matrix.dockerfile }} .

      - name: Trivy image scan (report-only)
        # renovate: datasource=docker depName=aquasec/trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.71.0 image \
            --severity HIGH,CRITICAL --exit-code 0 --format table \
            "local/scan:${{ matrix.target }}"
