---
# Self-hosted Renovate: opens dependency-update PRs in-repo (Docker base-image
# digests, GitHub Action SHAs, and uv/pep621 deps + uv.lock). Each PR re-runs
# ci.yml, so the new pins are build-verified before merge. Config: .github/renovate.json.
name: Renovate

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    env:
      # PAT or GitHub App token (NOT GITHUB_TOKEN) so Renovate's PRs trigger ci.yml.
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
      RENOVATE_REPOSITORIES: ${{ github.repository }}
      RENOVATE_PLATFORM: github
      LOG_LEVEL: info
    steps:
      - name: Run Renovate
        # renovate: datasource=docker depName=renovate/renovate
        run: |
          docker run --rm \
            -e RENOVATE_TOKEN -e RENOVATE_REPOSITORIES -e RENOVATE_PLATFORM -e LOG_LEVEL \
            renovate/renovate:43
