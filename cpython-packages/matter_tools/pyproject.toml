[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "matter_tools"
version = "0.1.0"
description = "Host-side Matter firmware building and board provisioning for ESP-Matter."
# Installs into ESP-IDF's own Python in Dockerfile.matter, not the repo's 3.12+
# venvs; datetime.UTC and tomllib set the floor.
requires-python = ">=3.11"

dependencies = [
    "cryptography>=50.0.0",
    "qrcode[pil]>=8.2",
    "esp-idf-nvs-partition-gen>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["matter_tools"]
