[project]
name = "micropython-boardfarm"
version = "0.8.0"
description = "Write MicroPython firmware that behaves the same across all supported microcontroller boards"
readme = "README.md"
requires-python = ">=3.12"


dependencies = [
    "boot_status_led>=0.2.0",
    "atgm336h>=0.1.0",
    "i2c_bus>=0.2.0",
    "mpu6050>=0.1.0",
    "qmc5883p>=0.1.0",
    "smoothing>=0.1.0",
    "vl53l0x>=0.1.0",
    "vl53l5cx>=0.1.1",
    "serial_over_web>=0.1.0",
    "micropython_stubs>=0.2.0",
]

# Puts each package's tests/ on sys.path so sibling helpers (fake_mpu6050.py, fake_vl53l0x.py) import without conftest sys.path hacks.
[tool.pytest.ini_options]
pythonpath = [
    "/firmware-packages/atgm336h/tests",
    "/firmware-packages/mpu6050/tests",
    "/firmware-packages/qmc5883p/tests",
    "/firmware-packages/smoothing/tests",
    "/firmware-packages/vl53l0x/tests",
    "/firmware-packages/vl53l5cx/tests",
]

[tool.uv.workspace]
members = [
    "projects/*",
]

# Internal packages resolve from a local flat index of wheels built by the
# wheels stage in Dockerfile.host — not from workspace source overrides.
# Resolving from an index is what makes uv honor the inter-package version
# floors declared above; a workspace source would pin the local version and
# silently discard them.
[[tool.uv.index]]
name = "internal"
url = "file:///wheels"
format = "flat"
explicit = true   # only sources pinned to it use it; third-party stays on PyPI

[tool.uv.sources]
serial_over_web = { index = "internal" }
micropython_stubs = { index = "internal" }
boot_status_led = { index = "internal" }
atgm336h = { index = "internal" }
i2c_bus = { index = "internal" }
mpu6050 = { index = "internal" }
qmc5883p = { index = "internal" }
smoothing = { index = "internal" }
vl53l0x = { index = "internal" }
vl53l5cx = { index = "internal" }

[dependency-groups]
viz = [
    "serial_over_web",
]
typecheck = [
    "ty>=0.0.42",
]
lint = [
    {include-group = "typecheck"},
    "ruff>=0.15.15",
    "yamllint>=1.38.0",
    "vulture>=2.16",
    "pydoclint>=0.8.4",
    "uv-secure>=0.17.2",
]
test = [
    {include-group = "viz"},
    {include-group = "typecheck"},
    "micropython_stubs",
    "boot_status_led",
    "atgm336h",
    "i2c_bus",
    "mpu6050",
    "qmc5883p",
    "smoothing",
    "vl53l0x",
    "vl53l5cx",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
]

# Packages install from wheels into site-packages, so measure them by import
# name (source_pkgs) rather than by source path. Project firmware is AST-loaded
# from the bind-mounted /projects tree, so it stays a path source.
[tool.coverage.run]
branch = true
source = [
  "/projects/compass/firmware",
  "/projects/distance-stream/firmware",
  "/projects/gps/firmware",
  "/projects/gyro-stream/firmware",
  "/projects/multizone-ranging/firmware",
]
source_pkgs = [
  "boot_status_led",
  "atgm336h",
  "i2c_bus",
  "mpu6050",
  "qmc5883p",
  "smoothing",
  "vl53l0x",
  "vl53l5cx",
  "serial_over_web",
]
omit = [
  "*/vl53l0x/vl53l0x.py",      # vendored upstream driver
  "*/vl53l5cx/vl53l5cx.py",    # vendored upstream driver
  "*/vl53l5cx/_config_bytes.py",  # vendored firmware binary data
  "*/tests/*",
  "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90

[tool.pydoclint]
style = "google"
allow-init-docstring = true
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
# Vendored drivers/data blobs. _config_bytes.py's fw_data() is a generator whose
# only pydoclint-clean return annotation (Generator/Iterator/Iterable) needs a
# typing/collections.abc import absent on MicroPython, so it can't be satisfied
# in frozen firmware — excluded like the vendored vl53l0x.py.
exclude = '\.venv|firmware-packages/vl53l0x/vl53l0x/vl53l0x\.py|firmware-packages/vl53l5cx/vl53l5cx/_config_bytes\.py|manifest\.py'

[tool.vulture]
min_confidence = 70
exclude = ["firmware-packages/vl53l0x/vl53l0x/vl53l0x.py", "manifest.py"]

[tool.ty.src]
include = [
  "firmware-packages",
  "cpython-packages",
  "projects",
]
exclude = [
  "firmware-packages/vl53l0x/vl53l0x/vl53l0x.py",
  "firmware-packages/vl53l5cx/vl53l5cx/vl53l5cx.py",
  "firmware-packages/vl53l5cx/vl53l5cx/_config_bytes.py",
  "manifest.py",
  "**/outputs/**",
]

# MicroPython APIs are partially stubbed and many firmware APIs are
# dynamically generated at runtime by board ports / firmware builds.
[[tool.ty.overrides]]
include = ["projects/*/firmware/**", "firmware-packages/*/*"]
rules.unresolved-import = "ignore"
rules.unresolved-attribute = "ignore"
rules.invalid-argument-type = "ignore"
rules.too-many-positional-arguments = "ignore"
rules.missing-argument = "ignore"
rules.invalid-assignment = "ignore"
rules.invalid-return-type = "ignore"
rules.invalid-base = "ignore"
rules.unsupported-operator = "ignore"

[[tool.ty.overrides]]
include = ["**/tests/**"]
rules.invalid-argument-type = "ignore"
rules.invalid-assignment = "ignore"
rules.unresolved-attribute = "ignore"
rules.unresolved-import = "ignore"

[[tool.ty.overrides]]
include = ["cpython-packages/micropython_stubs/**"]
rules.unresolved-attribute = "ignore"
rules.unresolved-import = "ignore"
rules.invalid-return-type = "ignore"

[tool.ruff]
target-version = "py312"
include = ["*.py", "*.pyi", "**/pyproject.toml"]
line-length = 100
indent-width = 4
extend-exclude = [
  "*.ipynb",
  "firmware-packages/vl53l0x/vl53l0x/vl53l0x.py",
  "firmware-packages/vl53l5cx/vl53l5cx/vl53l5cx.py",
  "firmware-packages/vl53l5cx/vl53l5cx/_config_bytes.py",
  ".vulture_allowlist.py",
  "manifest.py",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "C90",      # mccabe complexity
  "I",        # isort
  "N",        # pep8-naming
  "D",        # pydocstyle (Google)
  "UP",       # pyupgrade
  "FA",       # future-annotations
  "ANN",      # annotations
  "S",        # bandit security
  "BLE",      # blind-except
  "FBT",      # boolean-trap
  "B",        # bugbear
  "A",        # builtins
  "C4",       # comprehensions
  "ISC",      # implicit-str-concat
  "ICN",      # import-conventions
  "INP",      # implicit-namespace-package
  "PIE",      # misc misuse
  "T20",      # raw print() outside emit() corrupts the JSON stream parsed by viz
  "Q",        # quotes
  "RET",      # return-statement hygiene
  "SLF",      # private-member access
  "SIM",      # simplify
  "TID",      # tidy-imports
  "ARG",      # unused-arguments
  "PTH",      # use-pathlib
  "ERA",      # eradicate commented-out code — see AGENTS.md "Don't preserve the past"
  "PL",       # pylint
  "TRY",      # tryceratops (exception-handling hygiene)
  "FURB",     # refurb modernization
  "PERF",     # Perflint — MCU runs in tight loops with 264 KB SRAM
  "RUF",      # ruff-specific
]
ignore = [
  "ANN002", "ANN003", "ANN401",
  "B027",
  "ISC001",
  "FBT003",
  "TRY003", "EM101", "EM102",
  "RET504",
  "PERF203",
]
extend-unsafe-fixes = ["E", "F401"]
fixable = ["ALL"]
# Keep print/comment deletion manual.
unfixable = ["T201", "T203", "ERA001"]

[tool.ruff.lint.per-file-ignores]
# Firmware is flat-frozen; emit() owns print output.
"projects/*/firmware/*" = ["T201", "INP001"]
"**/{tests}/*" = [
  "PLR2004", "S101", "TID252",
  "PLC2701", "D100", "D103", "ANN201", "ANN202",
  "PLC0415",
  "ANN001", "ARG001", "ARG002",
  "S102",
  "SLF001",
  "INP001",
]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["IOError"]
builtins-allowed-modules = ["abc", "io", "types"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = [
  "boot_status_led",
  "atgm336h",
  "i2c_bus",
  "mpu6050",
  "qmc5883p",
  "smoothing",
  "vl53l0x",
  "vl53l5cx",
  "serial_over_web",
  "micropython_stubs",
]

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str"]
max-args = 8
max-positional-args = 5
max-locals = 15
