[project]
name = "micropython-boardfarm"
version = "0.2.0"
description = "Write MicroPython firmware that behaves the same across all supported microcontroller boards"
readme = "README.md"
requires-python = ">=3.12"


dependencies = [
    "boot_status_led>=0.1.0",
    "i2c_bus>=0.1.0",
    "mpu6050>=0.1.0",
    "vl53l0x>=0.1.0",
    "serial_over_web>=0.1.0",
    "micropython_stubs>=0.1.0",
]

# Puts each package's tests/ on sys.path so sibling helpers (fake_mpu6050.py, fake_vl53l0x.py) import without conftest sys.path hacks.
[tool.pytest.ini_options]
pythonpath = [
    "/firmware-packages/mpu6050/tests",
    "/firmware-packages/vl53l0x/tests",
]

[tool.uv.workspace]
members = [
    "cpython-packages/serial_over_web",
    "cpython-packages/micropython_stubs",
    "firmware-packages/boot_status_led",
    "firmware-packages/i2c_bus",
    "firmware-packages/mpu6050",
    "firmware-packages/vl53l0x",
]

[tool.uv.sources]
serial_over_web = { workspace = true }
micropython_stubs = { workspace = true }
boot_status_led = { workspace = true }
i2c_bus = { workspace = true }
mpu6050 = { workspace = true }
vl53l0x = { workspace = true }

[dependency-groups]
viz = [
    "serial_over_web",
]
typecheck = [
    "ty>=0.0.21",
]
lint = [
    {include-group = "typecheck"},
    "ruff>=0.12.12",
    "yamllint>=1.37.1",
    "yamlfix>=1.18.0",
    "vulture>=2.14",
    "pydoclint>=0.8.3",
    "uv-secure>=0.5.0",
]
test = [
    {include-group = "viz"},
    {include-group = "typecheck"},
    "micropython_stubs",
    "boot_status_led",
    "i2c_bus",
    "mpu6050",
    "vl53l0x",
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2",
]

# Container mount paths.
[tool.coverage.run]
branch = true
source = [
  "/work/firmware-packages/boot_status_led/boot_status_led",
  "/work/firmware-packages/i2c_bus/i2c_bus",
  "/work/firmware-packages/mpu6050/mpu6050",
  "/work/firmware-packages/vl53l0x/vl53l0x",
  "/projects/distance-stream/firmware",
  "/projects/gyro-stream/firmware",
  "/work/cpython-packages/serial_over_web/serial_over_web",
]
omit = [
  "*/vl53l0x/vl53l0x.py",   # vendored upstream driver
  "*/tests/*",
  "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90

[tool.pydoclint]
style = "google"
allow-init-docstring = true
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
exclude = '\.venv|firmware-packages/vl53l0x/vl53l0x/vl53l0x\.py|manifest\.py'

[tool.ty.src]
include = [
  "firmware-packages",
  "cpython-packages",
  "projects",
]
exclude = [
  "firmware-packages/vl53l0x/vl53l0x/vl53l0x.py",
  "manifest.py",
  "**/outputs/**",
]

# MicroPython APIs are partially stubbed and many firmware APIs are
# dynamically generated at runtime by board ports / firmware builds.
[[tool.ty.overrides]]
include = ["projects/*/firmware/**", "firmware-packages/*/*"]
rules.unresolved-import = "ignore"
rules.unresolved-attribute = "ignore"
rules.invalid-argument-type = "ignore"
rules.invalid-argument-count = "ignore"
rules.invalid-assignment = "ignore"
rules.invalid-return-type = "ignore"
rules.attribute-assignment = "ignore"
rules.invalid-base-class = "ignore"
rules.unsupported-operation = "ignore"

[[tool.ty.overrides]]
include = ["**/tests/**"]
rules.invalid-argument-type = "ignore"
rules.invalid-assignment = "ignore"
rules.unresolved-attribute = "ignore"
rules.unresolved-import = "ignore"

[[tool.ty.overrides]]
include = ["cpython-packages/micropython_stubs/**"]
rules.unresolved-attribute = "ignore"
rules.unresolved-import = "ignore"
rules.invalid-return-type = "ignore"

[tool.yamlfix]
sequence_style = "block_style"

[tool.ruff]
target-version = "py312"
include = ["*.py", "*.pyi", "**/pyproject.toml"]
line-length = 100
indent-width = 4
extend-exclude = [
  "*.ipynb",
  "firmware-packages/vl53l0x/vl53l0x/vl53l0x.py",
  ".vulture_allowlist.py",
  "manifest.py",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "C90",      # mccabe complexity
  "I",        # isort
  "N",        # pep8-naming
  "D",        # pydocstyle (Google)
  "UP",       # pyupgrade
  "FA",       # future-annotations
  "ANN",      # annotations
  "S",        # bandit security
  "BLE",      # blind-except
  "FBT",      # boolean-trap
  "B",        # bugbear
  "A",        # builtins
  "C4",       # comprehensions
  "ISC",      # implicit-str-concat
  "ICN",      # import-conventions
  "INP",      # implicit-namespace-package
  "PIE",      # misc misuse
  "T20",      # raw print() outside emit() corrupts the JSON stream parsed by viz
  "Q",        # quotes
  "RET",      # return-statement hygiene
  "SLF",      # private-member access
  "SIM",      # simplify
  "TID",      # tidy-imports
  "ARG",      # unused-arguments
  "PTH",      # use-pathlib
  "ERA",      # eradicate commented-out code — see AGENTS.md "Don't preserve the past"
  "PL",       # pylint
  "TRY",      # tryceratops (exception-handling hygiene)
  "FURB",     # refurb modernization
  "PERF",     # Perflint — MCU runs in tight loops with 264 KB SRAM
  "RUF",      # ruff-specific
]
ignore = [
  "ANN002", "ANN003", "ANN401",
  "B027",
  "ISC001",
  "FBT003",
  "TRY003", "EM101", "EM102",
  "RET504",
  "PERF203",
]

[tool.ruff.lint.per-file-ignores]
# Firmware is flat-frozen; emit() owns print output.
"projects/*/firmware/*" = ["T201", "INP001"]
"**/{tests}/*" = [
  "PLR2004", "S101", "TID252",
  "PLC2701", "D100", "D103", "ANN201", "ANN202",
  "PLC0415",
  "ANN001", "ARG001", "ARG002",
  "S102",
  "SLF001",
  "INP001",
]
extend-unsafe-fixes = ["E", "F401"]
fixable = ["ALL"]
# Keep print/comment deletion manual.
unfixable = ["T201", "T203", "ERA001"]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["IOError"]
builtins-allowed-modules = ["abc", "io", "types"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = [
  "boot_status_led",
  "i2c_bus",
  "mpu6050",
  "vl53l0x",
  "serial_over_web",
  "micropython_stubs",
]

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str"]
max-args = 8
max-positional-args = 5
max-locals = 15
