[project]
name = "micropython-boardfarm"
version = "0.1.0"
description = "Write MicroPython firmware that behaves the same across all supported microcontroller boards"
readme = "README.md"
requires-python = ">=3.12"


dependencies = [
    "boot_status_led>=0.1.0",
    "i2c_bus>=0.1.0",
    "mpu6050>=0.1.0",
    "vl53l0x>=0.1.0",
    "vl53l5cx>=0.1.0",
    "serial_over_web>=0.1.0",
    "micropython_stubs>=0.1.0",
]

# Puts each package's tests/ on sys.path so sibling helpers (fake_mpu6050.py, fake_vl53l0x.py) import without conftest sys.path hacks.
[tool.pytest.ini_options]
pythonpath = [
    "/firmware-packages/mpu6050/tests",
    "/firmware-packages/vl53l0x/tests",
    "/firmware-packages/vl53l5cx/tests",
]

# Host packages live as uv workspace members.
[tool.uv.workspace]
members = [
    "cpython-packages/serial_over_web",
    "cpython-packages/micropython_stubs",
    "firmware-packages/boot_status_led",
    "firmware-packages/i2c_bus",
    "firmware-packages/mpu6050",
    "firmware-packages/vl53l0x",
    "firmware-packages/vl53l5cx",
]

# Resolves dependency-group names to local workspace members instead of PyPI.
[tool.uv.sources]
serial_over_web = { workspace = true }
micropython_stubs = { workspace = true }
boot_status_led = { workspace = true }
i2c_bus = { workspace = true }
mpu6050 = { workspace = true }
vl53l0x = { workspace = true }
vl53l5cx = { workspace = true }

# Installed by `uv sync --group` in viz (Dockerfile.host) and pytest (Dockerfile.tests); test extends viz so pins stay identical.
[dependency-groups]
viz = [
    "serial_over_web",
]
test = [
    {include-group = "viz"},
    "micropython_stubs",
    "boot_status_led",
    "i2c_bus",
    "mpu6050",
    "vl53l0x",
    "vl53l5cx",
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2",
]

# Paths reflect the pytest container's mount layout (workspace members editable at /work, project firmware bind-mounted read-only at /projects).
[tool.coverage.run]
branch = true
source = [
  "/work/firmware-packages/boot_status_led/boot_status_led",
  "/work/firmware-packages/i2c_bus/i2c_bus",
  "/work/firmware-packages/mpu6050/mpu6050",
  "/work/firmware-packages/vl53l0x/vl53l0x",
  "/work/firmware-packages/vl53l5cx/vl53l5cx",
  "/projects/distance-stream/firmware",
  "/projects/gyro-stream/firmware",
  "/projects/multizone-ranging/firmware",
  "/work/cpython-packages/serial_over_web/serial_over_web",
]
omit = [
  "*/vl53l0x/vl53l0x.py",      # vendored upstream driver
  "*/vl53l5cx/vl53l5cx.py",    # vendored upstream driver
  "*/vl53l5cx/_config_bytes.py",  # vendored firmware binary data
  "*/tests/*",
  "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90

[tool.yamlfix]
sequence_style = "block_style"

[tool.ruff]
target-version = "py312"
include = ["*.py", "*.pyi", "**/pyproject.toml"]
line-length = 100
indent-width = 4
extend-exclude = [
  "*.ipynb",
  "firmware-packages/vl53l0x/vl53l0x/vl53l0x.py",
  "firmware-packages/vl53l5cx/vl53l5cx/vl53l5cx.py",
  "firmware-packages/vl53l5cx/vl53l5cx/_config_bytes.py",
  ".vulture_allowlist.py",
  "manifest.py",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "C90",      # mccabe complexity
  "I",        # isort
  "N",        # pep8-naming
  "D",        # pydocstyle (Google)
  "UP",       # pyupgrade
  "FA",       # future-annotations
  "ANN",      # annotations
  "S",        # bandit security
  "BLE",      # blind-except
  "FBT",      # boolean-trap
  "B",        # bugbear
  "A",        # builtins
  "C4",       # comprehensions
  "ISC",      # implicit-str-concat
  "ICN",      # import-conventions
  "INP",      # implicit-namespace-package
  "PIE",      # misc misuse
  "T20",      # raw print() outside emit() corrupts the JSON stream parsed by viz
  "Q",        # quotes
  "RET",      # return-statement hygiene
  "SLF",      # private-member access
  "SIM",      # simplify
  "TID",      # tidy-imports
  "ARG",      # unused-arguments
  "PTH",      # use-pathlib
  "ERA",      # eradicate commented-out code — see AGENTS.md "Don't preserve the past"
  "PL",       # pylint
  "TRY",      # tryceratops (exception-handling hygiene)
  "FURB",     # refurb modernization
  "PERF",     # Perflint — MCU runs in tight loops with 264 KB SRAM
  "RUF",      # ruff-specific
]
ignore = [
  # `*args` / `**kwargs` / `Any` are acceptable.
  "ANN002", "ANN003", "ANN401",
  # Allow empty non-abstract methods on ABCs.
  "B027",
  # Conflicts with ruff format.
  "ISC001",
  # Allow boolean positional values in calls like dict.get(..., True).
  "FBT003",
  # Force exception messages into named vars / templated strings — too noisy
  # for firmware where raising with a literal string is the common case.
  "TRY003", "EM101", "EM102",
  # Local name before `return` often documents intent (e.g. `result = ...; return result`).
  "RET504",
  # AGENTS.md mandates try/except inside the sensor.read() loop — PERF203
  # would flag exactly that pattern.
  "PERF203",
]

[tool.ruff.lint.per-file-ignores]
# Allows T201 (emit() is the sole print() site) and INP001 (firmware/ dirs are flat-frozen by manifest.py — no __init__.py).
"projects/*/firmware/*" = ["T201", "INP001"]
"**/{tests}/*" = [
  "PLR2004", "S101", "TID252",
  "PLC2701", "D100", "D103", "ANN201", "ANN202",
  # boot_status_led / i2c_bus tests re-import their packages mid-test after
  # the `chip` fixture swaps os.uname(), so import-time dispatch reruns.
  "PLC0415",
  # pytest fixtures routinely accept un-annotated request/monkeypatch and
  # ignore them (or use them implicitly via auto-application).
  "ANN001", "ARG001", "ARG002",
  # `exec()` in test_emit_schema imports the module-level helper without
  # running main()'s ranging loop.
  "S102",
  # Tests legitimately poke at `_private` internals to assert state.
  "SLF001",
  # Pytest convention: test dirs have no __init__.py so each is independent.
  "INP001",
]
extend-unsafe-fixes = ["E", "F401"]
fixable = ["ALL"]
# Auto-deletion of `print()` calls or commented-out code is too aggressive
# for `ruff check --fix` — surface the violation, let a human decide.
unfixable = ["T201", "T203", "ERA001"]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["IOError"]
builtins-allowed-modules = ["abc", "io", "types"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = [
  "boot_status_led",
  "i2c_bus",
  "mpu6050",
  "vl53l0x",
  "vl53l5cx",
  "serial_over_web",
  "micropython_stubs",
]

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str"]
max-args = 8
max-positional-args = 5
max-locals = 15
