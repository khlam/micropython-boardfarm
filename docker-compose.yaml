---
# Root-level services: pytest (full test suite) and uv (lockfile management).
# Per-project compose files own their own compile/esp32/viz etc.
services:
  pytest:
    build:
      context: .
      dockerfile: Dockerfile.tests
      target: pytest
    volumes:
      - ./firmware-packages:/firmware-packages:ro
      - ./projects:/projects:ro
      - ./cpython-packages/serial_over_web:/cpython-packages/serial_over_web:ro
      # Linux-only: expose the container's venv so VSCode + Pylance resolve
      # workspace packages. The venv contains Linux ELF binaries (won't run on
      # macOS/Windows).
      # - ./.venv:/work/.venv

  uv:
    build:
      context: .
      dockerfile: Dockerfile.host
      target: uv-runner
    working_dir: /workspace
    # Run as the host user so the generated uv.lock is host-owned, not root-owned.
    user: ${UID:-1000}:${GID:-1000}
    environment:
      # Redirect uv's cache off /root (read-only as non-root) to /tmp.
      - HOME=/tmp
      - XDG_CACHE_HOME=/tmp/.cache
    volumes:
      - .:/workspace
