---
services:
  # Builds the internal-package wheels; pytest/typecheck/uv consume them as the
  # file:// index via `additional_contexts: wheels: service:wheels`. Compose
  # builds this dependency first, so the consuming commands need no extra steps.
  wheels:
    build:
      context: .
      dockerfile: Dockerfile.host
      target: wheels
    command: ["true"]

  matter-native-test:
    build:
      context: .
      dockerfile: Dockerfile.tests
      target: matter-native-test

  pytest:
    build:
      context: .
      dockerfile: Dockerfile.tests
      target: pytest
      additional_contexts:
        wheels: service:wheels
    volumes:
      - ./firmware-packages:/firmware-packages:ro
      - ./projects:/projects:ro
      - ./cpython-packages/serial_over_web:/cpython-packages/serial_over_web:ro
      - ./tools:/tools:ro
      # Linux-only optional Pylance venv.
      # - ./.venv:/work/.venv

  typecheck:
    build:
      context: .
      dockerfile: Dockerfile.tests
      target: typecheck
      additional_contexts:
        wheels: service:wheels
    volumes:
      - ./firmware-packages:/work/firmware-packages:ro
      - ./cpython-packages:/work/cpython-packages:ro
      - ./projects:/work/projects:ro
      - ./tools:/work/tools:ro

  uv:
    build:
      context: .
      dockerfile: Dockerfile.host
      target: uv-runner
      additional_contexts:
        wheels: service:wheels
    working_dir: /workspace
    user: ${UID:-1000}:${GID:-1000}
    environment:
      - HOME=/tmp
      - XDG_CACHE_HOME=/tmp/.cache
    volumes:
      - .:/workspace
