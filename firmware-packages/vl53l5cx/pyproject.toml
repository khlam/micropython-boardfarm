[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vl53l5cx"
version = "0.1.1"
description = "MicroPython driver for the VL53L5CX 8×8 multizone ToF sensor (vendored from mp-extras/vl53l5cx)."
requires-python = ">=3.12"

[tool.hatch.build.targets.wheel]
packages = ["vl53l5cx"]
