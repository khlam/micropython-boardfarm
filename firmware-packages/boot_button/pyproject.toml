[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boot_button"
version = "0.1.0"
description = "Chip-dispatched, event-driven onboard BOOT button with a uniform on_press callback."
requires-python = ">=3.12"

[tool.hatch.build.targets.wheel]
packages = ["boot_button"]
