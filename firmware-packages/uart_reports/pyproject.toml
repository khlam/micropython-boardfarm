[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uart_reports"
version = "0.1.0"
description = "Internal IRQ-driven reader for fixed-length framed UART reports, consumed only by radar drivers."
requires-python = ">=3.12"

[tool.hatch.build.targets.wheel]
packages = ["uart_reports"]
