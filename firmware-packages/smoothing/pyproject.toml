[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smoothing"
version = "0.1.0"
description = "MicroPython sliding-window smoothing functions (simple/weighted/exponential moving average, median)."
requires-python = ">=3.12"

[tool.hatch.build.targets.wheel]
packages = ["smoothing"]
