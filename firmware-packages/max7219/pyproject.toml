[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "max7219"
version = "0.1.0"
description = "MicroPython MAX7219 cascaded LED-matrix backend for pixel_display frames."
requires-python = ">=3.12"
dependencies = [
    "pixel_display>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["max7219"]
