[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "max7219"
version = "0.1.0"
description = "MicroPython MAX7219 cascaded LED-matrix driver with a 5x7 font and text rendering."
requires-python = ">=3.12"

[tool.hatch.build.targets.wheel]
packages = ["max7219"]
