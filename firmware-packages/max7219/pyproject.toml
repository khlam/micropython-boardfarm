[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "max7219"
version = "0.1.0"
description = "MicroPython MAX7219 8x32 LED-matrix driver, fonts, and clock display-cycle, with chip-specific SPI backends."
requires-python = ">=3.12"

[tool.hatch.build.targets.wheel]
packages = ["max7219"]
