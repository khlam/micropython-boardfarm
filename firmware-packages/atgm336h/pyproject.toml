[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atgm336h"
version = "0.2.0"
description = "MicroPython UART NMEA reader for the ATGM336H GPS module, with chip-specific backends."
requires-python = ">=3.12"

[tool.hatch.build.targets.wheel]
packages = ["atgm336h"]
