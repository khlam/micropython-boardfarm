[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "board_pinout"
version = "0.1.0"
description = "Single source of truth for each board's pin topology (buses + device attachments)."
requires-python = ">=3.12"

[tool.hatch.build.targets.wheel]
packages = ["board_pinout"]
